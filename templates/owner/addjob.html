{% extends 'owner/base.html' %}
{% load static %}

{% block content %}

<div class="container mx-auto p-6 max-w-3xl bg-white shadow-md rounded-lg">
   
    <!-- Header -->
    <h2 class="text-2xl font-semibold mb-6 text-center text-gray-800">JOBS</h2>

    <!-- Job Form -->
    <form method="POST" action="{% url 'addjob' %}" class="space-y-5">
        {% csrf_token %}

        <!-- Job Title -->
        <div>
            <label for="jobTitle" class="block font-semibold text-gray-700 mb-2">Job Title</label>
            <input type="text" id="jobTitle" name="jobTitle" 
                   class="w-full border-gray-300 rounded-md p-3 shadow-sm focus:ring-teal-500 focus:border-teal-500" 
                   placeholder="Enter Job Title" required>
        </div>

        <!-- Job Category (Selection and Manual Entry) -->
        <div>
            <label for="jobCategory" class="block font-semibold text-gray-700 mb-2">Job Category</label>
            <select id="jobCategory" name="jobCategory" 
                    class="w-full border-gray-300 rounded-md p-3 shadow-sm focus:ring-teal-500 focus:border-teal-500">
                <option value="">Select Job Category</option>
                {% for category in categories %}
                    <option value="{{ category.id }}">{{ category.name }}</option>
                {% endfor %}
            </select>
            <div class="mt-2">
                <label for="newJobCategory" class="block font-semibold text-gray-700 mb-2">Or Add New Category</label>
                <input type="text" id="newJobCategory" name="newJobCategory" 
                       class="w-full border-gray-300 rounded-md p-3 shadow-sm focus:ring-teal-500 focus:border-teal-500" 
                       placeholder="Enter New Job Category">
            </div>
        </div>

        <!-- Job Status -->
        <div>
            <label for="status" class="block font-semibold text-gray-700 mb-2">Job Status</label>
            <select id="status" name="status" 
                    class="w-full border-gray-300 rounded-md p-3 shadow-sm focus:ring-teal-500 focus:border-teal-500">
                <option value="pending">Pending</option>
                <option value="completed">Completed</option>
            </select>
        </div>

        <!-- Assigned Employee -->
        <div>
            <label for="assignedEmployee" class="block font-semibold text-gray-700 mb-2">Assign Employee</label>
            <select id="assignedEmployee" name="assignedEmployee" 
                    class="w-full border-gray-300 rounded-md p-3 shadow-sm focus:ring-teal-500 focus:border-teal-500">
                <option value="">Select Employee</option>
                {% for employee in employees %}
                    <option value="{{ employee.id }}">{{ employee.name }}</option>
                {% endfor %}
            </select>
        </div>

        <!-- Created Date -->
        <div>
            <label for="createdDate" class="block font-semibold text-gray-700 mb-2">Created Date</label>
            <input type="date" id="createdDate" name="createdDate" 
                   class="w-full border-gray-300 rounded-md p-3 shadow-sm focus:ring-teal-500 focus:border-teal-500" required>
        </div>

        <!-- Last Updated -->
        <div>
            <label for="lastUpdated" class="block font-semibold text-gray-700 mb-2">Last Updated</label>
            <input type="date" id="lastUpdated" name="lastUpdated" 
                   class="w-full border-gray-300 rounded-md p-3 shadow-sm focus:ring-teal-500 focus:border-teal-500">
        </div>

        <!-- Last Delivery Date -->
        <div>
            <label for="lastDeliveryDate" class="block font-semibold text-gray-700 mb-2">Last Delivery Date</label>
            <input type="date" id="lastDeliveryDate" name="lastDeliveryDate" 
                   class="w-full border-gray-300 rounded-md p-3 shadow-sm focus:ring-teal-500 focus:border-teal-500">
        </div>

        <!-- Submit Button -->
        <div class="flex justify-center">
            <button type="submit" 
                    class="bg-teal-500 text-white px-6 py-3 rounded-md font-semibold hover:bg-teal-600 transition">
                Add Job
            </button>
        </div>
    </form>
    
{% comment %} </div> {% endcomment %}

{% endblock content %}
