<!-- Filter Section -->
<div class="flex justify-between items-center bg-gray-200 p-3 rounded mb-4">
    <div>
        <label for="statusFilter" class="mr-2 font-bold">Filter by Status:</label>
        <select id="statusFilter" class="p-2 border rounded">
            <option value="all">All</option>
            <option value="completed">Completed</option>
            <option value="pending">Pending</option>
        </select>
    </div>
    <div>
        <label for="timeFilter" class="mr-2 font-bold">Filter by Time:</label>
        <select id="timeFilter" class="p-2 border rounded">
            <option value="all">All Time</option>
            <option value="day">Today</option>
            <option value="week">This Week</option>
            <option value="month">This Month</option>
            <option value="year">This Year</option>
        </select>
    </div>
    <button onclick="filterJobs()" class="bg-teal-500 text-white px-4 py-2 rounded">Apply Filter</button>
</div>

<!-- Job Tables (Today's Job & Pending Jobs) -->
<div id="jobContainer">
    <table class="w-full border-collapse border border-gray-300">
        <thead>
            <tr class="bg-gray-300">
                <th class="border border-gray-300 p-2">Job Title</th>
                <th class="border border-gray-300 p-2">Status</th>
                <th class="border border-gray-300 p-2">Date</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td class="border border-gray-300 p-2">Job 1</td>
                <td class="border border-gray-300 p-2">
                    <select class="status-select">
                        <option value="completed">Completed</option>
                        <option value="pending">Pending</option>
                    </select>
                </td>
                <td class="border border-gray-300 p-2">2025-01-31</td>
            </tr>
            <tr>
                <td class="border border-gray-300 p-2">Job 2</td>
                <td class="border border-gray-300 p-2">
                    <select class="status-select">
                        <option value="completed">Completed</option>
                        <option value="pending">Pending</option>
                    </select>
                </td>
                <td class="border border-gray-300 p-2">2025-01-30</td>
            </tr>
        </tbody>
    </table>
</div>

<script>
function filterJobs() {
    const statusFilter = document.getElementById("statusFilter").value;
    const timeFilter = document.getElementById("timeFilter").value;
    
    document.querySelectorAll("tbody tr").forEach(row => {
        const statusSelect = row.querySelector(".status-select");
        const statusValue = statusSelect ? statusSelect.value : "pending";
        const statusMatch = statusFilter === "all" || statusFilter === statusValue;
        
        // Placeholder for date-based filtering (adjust as needed)
        const timeMatch = timeFilter === "all"; 
        
        row.style.display = statusMatch && timeMatch ? "table-row" : "none";
    });
}
</script>
