{% extends 'owner/base.html' %}
{% block content %}
<div class="container mx-auto p-6 max-w-lg bg-white shadow-md rounded-lg">
    
    <h2 class="text-2xl font-semibold mb-6 text-gray-800 text-center">Add Employee</h2>

    <form method="POST" action="{% url 'add_employee' %}" class="space-y-5">
        {% csrf_token %}

        <div>
            <label class="block font-semibold text-gray-700 mb-2">Name</label>
            <input type="text" name="name" required class="w-full border-gray-300 rounded-md p-3 shadow-sm">
        </div>

        <div>
            <label class="block font-semibold text-gray-700 mb-2">Email</label>
            <input type="email" name="email" required class="w-full border-gray-300 rounded-md p-3 shadow-sm">
        </div>

        <div>
            <label class="block font-semibold text-gray-700 mb-2">Phone</label>
            <input type="text" name="phone" required class="w-full border-gray-300 rounded-md p-3 shadow-sm">
        </div>

        <div>
            <label class="block font-semibold text-gray-700 mb-2">Job Category</label>
            <select name="job_category" required class="w-full border-gray-300 rounded-md p-3 shadow-sm">
                <option value="" disabled selected>Select a category</option>
                <option value="HR">HR</option>
                <option value="Engineering">Engineering</option>
                <option value="Sales">Sales</option>
                <option value="Marketing">Marketing</option>
                <option value="Finance">Finance</option>
                <option value="add_category" class="text-teal-500">Add New Category</option>  <!-- Option to add a new category -->
            </select>
        </div>

        <div id="new-category-div" style="display: none;">
            <label class="block font-semibold text-gray-700 mb-2">New Category Name</label>
            <input type="text" id="new-category" name="new_category" class="w-full border-gray-300 rounded-md p-3 shadow-sm">
        </div>

        <div class="flex justify-center">
            <button type="submit" class="bg-teal-500 text-white px-6 py-3 rounded-md font-semibold hover:bg-teal-600">
                Add Employee
            </button>
        </div>
    </form>
</div>

<script>
    // Toggle the visibility of the "new category" input field
    document.querySelector('select[name="job_category"]').addEventListener('change', function() {
        const newCategoryDiv = document.getElementById('new-category-div');
        if (this.value === 'add_category') {
            newCategoryDiv.style.display = 'block';
        } else {
            newCategoryDiv.style.display = 'none';
        }
    });
</script>

{% endblock %}
