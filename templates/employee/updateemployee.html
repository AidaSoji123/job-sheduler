{% extends 'owner/base.html' %}

{% block content %}
<div class="container mt-5">
    <h2 class="mb-4">Update Employee</h2>

    <!-- Display Messages -->
    {% if messages %}
    <div class="alert alert-info">
        {% for message in messages %}
        {{ message }}
        {% endfor %}
    </div>
    {% endif %}

    <form method="POST">
        {% csrf_token %}
        
        <div class="mb-3">
            <label for="name" class="form-label">Full Name</label>
            <input type="text" id="name" name="name" class="form-control" value="{{ employee.name }}" required>
        </div>

        <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" id="email" name="email" class="form-control" value="{{ employee.email }}" required>
        </div>

        <div class="mb-3">
            <label for="phone" class="form-label">Phone</label>
            <input type="text" id="phone" name="phone" class="form-control" value="{{ employee.phone }}" required>
        </div>

        <div class="mb-3">
            <label for="department" class="form-label">Department</label>
            <input type="text" id="department" name="department" class="form-control" value="{{ employee.department }}" required>
        </div>

        <button type="submit" class="btn btn-primary">Update Employee</button>
        <a href="{% url 'employee' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
